name: Update Sleeper data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Sleeper data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const USERNAME = "ViennaSteel";
            const SEASON = "2026";
            const API = "https://api.sleeper.app/v1";

            async function get(p) {
              const r = await fetch(API + p);
              if (!r.ok) throw new Error(`Sleeper ${r.status}: ${p}`);
              return await r.json();
            }

            function ensureDir(p) {
              fs.mkdirSync(p, { recursive: true });
            }

            function writeJson(filename, data) {
              ensureDir(path.dirname(filename));
              fs.writeFileSync(filename, JSON.stringify(data, null, 2) + "\n");
            }

            function playerInfo(id, p, trendingAdds = 0) {
              return {
                player_id: id,
                name:
                  p?.full_name ||
                  [p?.first_name, p?.last_name].filter(Boolean).join(" ") ||
                  id,
                team: p?.team ?? null,
                position: p?.position ?? null,
                fantasy_positions: p?.fantasy_positions ?? [],
                status: p?.status ?? null,
                injury_status: p?.injury_status ?? null,
                injury_body_part: p?.injury_body_part ?? null,
                injury_notes: p?.injury_notes ?? null,
                practice_participation: p?.practice_participation ?? null,
                depth_chart_position: p?.depth_chart_position ?? null,
                trending_adds_24h: trendingAdds
              };
            }

            const user = await get(`/user/${encodeURIComponent(USERNAME)}`);
            if (!user?.user_id) throw new Error(`Sleeper user "${USERNAME}" not found`);

            const [state, leagues, players, trendingAdds, trendingDrops] = await Promise.all([
              get("/state/nfl"),
              get(`/user/${user.user_id}/leagues/nfl/${SEASON}`),
              get("/players/nfl"),
              get("/players/nfl/trending/add?lookback_hours=24&limit=200").catch(() => []),
              get("/players/nfl/trending/drop?lookback_hours=24&limit=200").catch(() => [])
            ]);

            const trendAddMap = new Map(
              trendingAdds.map(x => [String(x.player_id), Number(x.count || 0)])
            );
            const trendDropMap = new Map(
              trendingDrops.map(x => [String(x.player_id), Number(x.count || 0)])
            );
            const weekNumbers = Array.from({ length: 18 }, (_, index) => index + 1);
            const projectionWeeks = await Promise.all(weekNumbers.map(week =>
              fetch(`https://api.sleeper.com/projections/nfl/${SEASON}/${week}?season_type=regular`)
                .then(r => (r.ok ? r.json() : []))
                .catch(() => [])
            ));
            const projectionMaps = new Map(weekNumbers.map((week, index) => [
              week,
              new Map(projectionWeeks[index].map(item => [String(item.player_id), item]))
            ]));
            const normalizePlayerName = value => String(value || "")
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLowerCase()
              .replace(/\b(jr|sr|ii|iii|iv)\b/g, "")
              .replace(/[^a-z0-9]/g, "");
            const ownershipData = await fetch(
              `https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/${SEASON}/segments/0/leaguedefaults/1?view=kona_player_info`,
              {
                headers: {
                  "x-fantasy-filter": JSON.stringify({
                    players: { limit: 2000, sortPercOwned: { sortPriority: 1, sortAsc: false } }
                  })
                }
              }
            )
              .then(r => (r.ok ? r.json() : { players: [] }))
              .catch(() => ({ players: [] }));
            const ownershipMap = new Map(
              (ownershipData.players || []).map(item => [
                normalizePlayerName(item.player?.fullName),
                item.player?.ownership || null
              ])
            );
            const espnWeeks = await Promise.all(weekNumbers.map(week =>
              fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${SEASON}&seasontype=2&week=${week}`)
                .then(r => (r.ok ? r.json() : { events: [] }))
                .catch(() => ({ events: [] }))
            ));
            const teamAliases = { WSH: "WAS" };
            const kickoffMaps = new Map();
            weekNumbers.forEach((week, index) => {
              const kickoffMap = new Map();
              for (const event of espnWeeks[index].events || []) {
                for (const competitor of event.competitions?.[0]?.competitors || []) {
                  const abbreviation = teamAliases[competitor.team?.abbreviation] || competitor.team?.abbreviation;
                  if (abbreviation && event.date) kickoffMap.set(abbreviation, event.date);
                }
              }
              kickoffMaps.set(week, kickoffMap);
            });

            const fantasyContext = {
              updated_at: new Date().toISOString(),
              bridge: "ViennaSteel Fantasy Manager",
              version: 3,
              username: USERNAME,
              sleeper_user_id: user.user_id,
              season: SEASON,
              nfl_week: state.week,
              leagues: []
            };

            ensureDir("data/leagues");
            ensureDir("data/waivers");
            ensureDir("data/trades");

            for (const league of leagues) {
              const [rosters, users, matchupWeeks] = await Promise.all([
                get(`/league/${league.league_id}/rosters`),
                get(`/league/${league.league_id}/users`),
                Promise.all(weekNumbers.map(week =>
                  get(`/league/${league.league_id}/matchups/${week}`).catch(() => [])
                ))
              ]);

              const mine = rosters.find(r => r.owner_id === user.user_id) || null;
              if (!mine) continue;

              const usersById = new Map(users.map(u => [u.user_id, u]));
              const me = usersById.get(user.user_id) || null;
              const reserve = new Set((mine.reserve || []).map(String));
              const rostered = new Set();

              for (const r of rosters) {
                for (const id of r.players || []) rostered.add(String(id));
              }

              const matchupsByWeek = new Map(weekNumbers.map((week, index) => [week, matchupWeeks[index]]));

              function standingsThrough(selectedWeek) {
                const records = new Map(rosters.map(roster => [roster.roster_id, { wins: 0, losses: 0, ties: 0, points: 0 }]));
                const completedThrough = selectedWeek < Number(state.week) ? selectedWeek : Math.max(0, Number(state.week) - 1);
                for (let week = 1; week <= completedThrough; week += 1) {
                  const groups = new Map();
                  for (const entry of matchupsByWeek.get(week) || []) {
                    if (!groups.has(entry.matchup_id)) groups.set(entry.matchup_id, []);
                    groups.get(entry.matchup_id).push(entry);
                    const record = records.get(entry.roster_id);
                    if (record) record.points += Number(entry.points || 0);
                  }
                  for (const entries of groups.values()) {
                    if (entries.length !== 2) continue;
                    const [a, b] = entries;
                    const aRecord = records.get(a.roster_id);
                    const bRecord = records.get(b.roster_id);
                    if (!aRecord || !bRecord) continue;
                    if (Number(a.points || 0) > Number(b.points || 0)) { aRecord.wins += 1; bRecord.losses += 1; }
                    else if (Number(a.points || 0) < Number(b.points || 0)) { bRecord.wins += 1; aRecord.losses += 1; }
                    else { aRecord.ties += 1; bRecord.ties += 1; }
                  }
                }
                const ordered = [...rosters].sort((a, b) => {
                  const ar = records.get(a.roster_id);
                  const br = records.get(b.roster_id);
                  return br.wins - ar.wins || br.ties - ar.ties || br.points - ar.points || Number(a.roster_id) - Number(b.roster_id);
                });
                ordered.forEach((roster, index) => { records.get(roster.roster_id).rank = index + 1; });
                return records;
              }

              function teamIdentity(roster, standings) {
                if (!roster) return null;
                const owner = usersById.get(roster.owner_id) || null;
                const record = standings?.get(roster.roster_id) || {};
                return {
                  roster_id: roster.roster_id,
                  team_name:
                    owner?.metadata?.team_name ||
                    owner?.display_name ||
                    `Roster ${roster.roster_id}`,
                  owner_name: owner?.display_name || null,
                  avatar: owner?.metadata?.avatar || owner?.avatar || null,
                  wins: Number(record.wins || 0),
                  losses: Number(record.losses || 0),
                  ties: Number(record.ties || 0),
                  rank: record.rank || null
                };
              }

              const weeks = {};
              for (const week of weekNumbers) {
                const matchups = matchupsByWeek.get(week) || [];
                const myMatchup = matchups.find(m => m.roster_id === mine.roster_id) || null;
                const opponent = myMatchup
                  ? matchups.find(m => m.matchup_id === myMatchup.matchup_id && m.roster_id !== mine.roster_id) || null
                  : null;
                const opponentRoster = opponent
                  ? rosters.find(r => r.roster_id === opponent.roster_id) || null
                  : null;
                const weeklyStarters = new Set((myMatchup?.starters || mine.starters || []).map(String));
                const weeklyPlayerIds = (myMatchup?.players?.length ? myMatchup.players : mine.players || []).map(String);
                const projectionMap = projectionMaps.get(week) || new Map();
                const kickoffMap = kickoffMaps.get(week) || new Map();
                const points = myMatchup?.players_points || {};
                const weeklyTeam = weeklyPlayerIds.map(id => {
                  const base = playerInfo(id, players[id], trendAddMap.get(id) || 0);
                  const projection = projectionMap.get(id) || null;
                  const ownership = ownershipMap.get(normalizePlayerName(base.name)) || null;
                  const projected = Number(projection?.stats?.pts_ppr);
                  const hasActual = Object.prototype.hasOwnProperty.call(points, id);
                  return {
                    ...base,
                    trending_drops_24h: trendDropMap.get(id) || 0,
                    slot: weeklyStarters.has(id) ? "STARTER" : (week === Number(state.week) && reserve.has(id) ? "IR" : "BENCH"),
                    projected_points: Number.isFinite(projected) ? projected : null,
                    rostered_percent: Number.isFinite(Number(ownership?.percentOwned)) ? Number(ownership.percentOwned) : null,
                    start_percent: Number.isFinite(Number(ownership?.percentStarted)) ? Number(ownership.percentStarted) : null,
                    actual_points: hasActual ? Number(points[id] || 0) : null,
                    week_opponent: projection?.opponent || null,
                    game_date: projection?.date || null,
                    game_start: kickoffMap.get(base.team) || null,
                    projection_updated_at: projection?.updated_at || null
                  };
                });
                const standings = standingsThrough(week);
                weeks[week] = {
                  week,
                  team: weeklyTeam,
                  matchup: myMatchup,
                  opponent,
                  my_team: teamIdentity(mine, standings),
                  opponent_team: teamIdentity(opponentRoster, standings)
                };
              }

              const fantasyPositions = ["QB", "RB", "WR", "TE", "K", "DEF"];
              const available = [];

              for (const [id, p] of Object.entries(players)) {
                if (rostered.has(String(id))) continue;
                const positions = new Set(
                  [p?.position, ...(p?.fantasy_positions || [])].filter(Boolean)
                );
                if (!fantasyPositions.some(x => positions.has(x))) continue;

                const info = playerInfo(String(id), p, trendAddMap.get(String(id)) || 0);
                if (!info.team && info.trending_adds_24h === 0) continue;
                available.push(info);
              }

              available.sort((a, b) => {
                if (b.trending_adds_24h !== a.trending_adds_24h) return b.trending_adds_24h - a.trending_adds_24h;
                const at = a.team ? 1 : 0;
                const bt = b.team ? 1 : 0;
                if (bt !== at) return bt - at;
                const ad = Number(a.depth_chart_position ?? 99);
                const bd = Number(b.depth_chart_position ?? 99);
                if (ad !== bd) return ad - bd;
                return (a.name || "").localeCompare(b.name || "");
              });

              const waiverIndex = {
                updated_at: new Date().toISOString(),
                week: state.week,
                league_id: league.league_id,
                league_name: league.name,
                files: {}
              };

              for (const pos of fantasyPositions) {
                const limit = pos === "K" || pos === "DEF" ? 20 : 50;
                const list = available
                  .filter(p => p.position === pos || (p.fantasy_positions || []).includes(pos))
                  .slice(0, limit);

                const waiverPath = `data/waivers/${league.league_id}/${pos}.json`;
                writeJson(waiverPath, {
                  updated_at: new Date().toISOString(),
                  week: state.week,
                  league_id: league.league_id,
                  league_name: league.name,
                  position: pos,
                  available: list
                });
                waiverIndex.files[pos] = waiverPath;
              }

              writeJson(`data/waivers/${league.league_id}/index.json`, waiverIndex);

              // League-wide roster snapshot for trade analysis.
              const allTeams = rosters.map(r => {
                const owner = usersById.get(r.owner_id) || null;
                const teamStarters = new Set((r.starters || []).map(String));
                const teamReserve = new Set((r.reserve || []).map(String));
                const namedPlayers = (r.players || []).map(rawId => {
                  const id = String(rawId);
                  return {
                    ...playerInfo(id, players[id], trendAddMap.get(id) || 0),
                    trending_drops_24h: trendDropMap.get(id) || 0,
                    slot: teamStarters.has(id)
                      ? "STARTER"
                      : teamReserve.has(id)
                      ? "IR"
                      : "BENCH"
                  };
                });

                const counts = {};
                for (const p of namedPlayers) {
                  for (const pos of (p.fantasy_positions?.length ? p.fantasy_positions : [p.position]).filter(Boolean)) {
                    counts[pos] = (counts[pos] || 0) + 1;
                  }
                }

                return {
                  roster_id: r.roster_id,
                  owner_id: r.owner_id,
                  display_name: owner?.display_name || null,
                  team_name: owner?.metadata?.team_name || owner?.display_name || `Roster ${r.roster_id}`,
                  is_me: r.owner_id === user.user_id,
                  position_counts: counts,
                  players: namedPlayers
                };
              });

              const tradePath = `data/trades/${league.league_id}.json`;
              writeJson(tradePath, {
                updated_at: new Date().toISOString(),
                week: state.week,
                league_id: league.league_id,
                league_name: league.name,
                scoring_settings: league.scoring_settings,
                roster_positions: league.roster_positions,
                teams: allTeams
              });

              const leaguePayload = {
                updated_at: new Date().toISOString(),
                week: state.week,
                available_weeks: weekNumbers,
                weeks,
                league: {
                  league_id: league.league_id,
                  name: league.name,
                  season: league.season,
                  status: league.status,
                  teams: league.total_rosters,
                  roster_positions: league.roster_positions,
                  scoring_settings: league.scoring_settings,
                  settings: league.settings
                },
                my_team_name: me?.metadata?.team_name || me?.display_name || USERNAME,
                my_team: weeks[state.week]?.my_team || null,
                my_roster_id: mine.roster_id,
                team: weeks[state.week]?.team || [],
                matchup: weeks[state.week]?.matchup || null,
                opponent: weeks[state.week]?.opponent || null,
                opponent_team: weeks[state.week]?.opponent_team || null,
                waiver_index: `data/waivers/${league.league_id}/index.json`,
                trade_file: tradePath
              };

              writeJson(`data/leagues/${league.league_id}.json`, leaguePayload);

              fantasyContext.leagues.push({
                league_id: league.league_id,
                name: league.name,
                teams: league.total_rosters,
                my_roster_id: mine.roster_id,
                my_team_name: me?.metadata?.team_name || me?.display_name || USERNAME,
                league_file: `data/leagues/${league.league_id}.json`,
                waiver_index: `data/waivers/${league.league_id}/index.json`,
                trade_file: tradePath
              });
            }

            writeJson("data/context.json", fantasyContext);

      - name: Commit updated data
        run: |
          git config user.name "ViennaSteel Fantasy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Sleeper data"
            git pull --rebase origin main
            git push
          fi
