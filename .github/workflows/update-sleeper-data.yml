name: Update Sleeper data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Sleeper data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const USERNAME = "ViennaSteel";
            const SEASON = "2026";
            const API = "https://api.sleeper.app/v1";

            async function get(p) {
              const r = await fetch(API + p);
              if (!r.ok) throw new Error(`Sleeper ${r.status}: ${p}`);
              return await r.json();
            }

            function ensureDir(p) {
              fs.mkdirSync(p, { recursive: true });
            }

            function writeJson(filename, data) {
              ensureDir(path.dirname(filename));
              fs.writeFileSync(filename, JSON.stringify(data, null, 2) + "\n");
            }

            function playerInfo(id, p, trendingAdds = 0) {
              return {
                player_id: id,
                name:
                  p?.full_name ||
                  [p?.first_name, p?.last_name].filter(Boolean).join(" ") ||
                  id,
                team: p?.team ?? null,
                position: p?.position ?? null,
                fantasy_positions: p?.fantasy_positions ?? [],
                status: p?.status ?? null,
                injury_status: p?.injury_status ?? null,
                injury_body_part: p?.injury_body_part ?? null,
                injury_notes: p?.injury_notes ?? null,
                practice_participation: p?.practice_participation ?? null,
                depth_chart_position: p?.depth_chart_position ?? null,
                trending_adds_24h: trendingAdds
              };
            }

            const user = await get(`/user/${encodeURIComponent(USERNAME)}`);
            if (!user?.user_id) throw new Error(`Sleeper user "${USERNAME}" not found`);

            const [state, leagues, players, trendingAdds, trendingDrops] = await Promise.all([
              get("/state/nfl"),
              get(`/user/${user.user_id}/leagues/nfl/${SEASON}`),
              get("/players/nfl"),
              get("/players/nfl/trending/add?lookback_hours=24&limit=200").catch(() => []),
              get("/players/nfl/trending/drop?lookback_hours=24&limit=200").catch(() => [])
            ]);

            const trendAddMap = new Map(
              trendingAdds.map(x => [String(x.player_id), Number(x.count || 0)])
            );
            const trendDropMap = new Map(
              trendingDrops.map(x => [String(x.player_id), Number(x.count || 0)])
            );
            const projections = await fetch(
              `https://api.sleeper.com/projections/nfl/${SEASON}/${state.week}?season_type=regular`
            )
              .then(r => (r.ok ? r.json() : []))
              .catch(() => []);
            const projectionMap = new Map(
              projections.map(item => [String(item.player_id), item])
            );

            const fantasyContext = {
              updated_at: new Date().toISOString(),
              bridge: "ViennaSteel Fantasy Manager",
              version: 3,
              username: USERNAME,
              sleeper_user_id: user.user_id,
              season: SEASON,
              nfl_week: state.week,
              leagues: []
            };

            ensureDir("data/leagues");
            ensureDir("data/waivers");
            ensureDir("data/trades");

            for (const league of leagues) {
              const [rosters, users, matchups] = await Promise.all([
                get(`/league/${league.league_id}/rosters`),
                get(`/league/${league.league_id}/users`),
                get(`/league/${league.league_id}/matchups/${state.week}`)
              ]);

              const mine = rosters.find(r => r.owner_id === user.user_id) || null;
              if (!mine) continue;

              const usersById = new Map(users.map(u => [u.user_id, u]));
              const me = usersById.get(user.user_id) || null;
              const starters = new Set((mine.starters || []).map(String));
              const reserve = new Set((mine.reserve || []).map(String));
              const rostered = new Set();

              for (const r of rosters) {
                for (const id of r.players || []) rostered.add(String(id));
              }

              const team = (mine.players || []).map(rawId => {
                const id = String(rawId);
                return {
                  ...playerInfo(id, players[id], trendAddMap.get(id) || 0),
                  trending_drops_24h: trendDropMap.get(id) || 0,
                  slot: starters.has(id)
                    ? "STARTER"
                    : reserve.has(id)
                    ? "IR"
                    : "BENCH"
                };
              });

              const myMatchup =
                matchups.find(m => m.roster_id === mine.roster_id) || null;
              const opponent =
                myMatchup
                  ? matchups.find(
                      m =>
                        m.matchup_id === myMatchup.matchup_id &&
                        m.roster_id !== mine.roster_id
                    ) || null
                  : null;
              const opponentRoster = opponent
                ? rosters.find(r => r.roster_id === opponent.roster_id) || null
                : null;
              const teamWithWeekData = team.map(player => {
                const projection = projectionMap.get(String(player.player_id)) || null;
                const projected = Number(projection?.stats?.pts_ppr);
                const points = myMatchup?.players_points || {};
                const hasActual = Object.prototype.hasOwnProperty.call(points, String(player.player_id));
                return {
                  ...player,
                  projected_points: Number.isFinite(projected) ? projected : null,
                  actual_points: hasActual ? Number(points[String(player.player_id)] || 0) : null,
                  week_opponent: projection?.opponent || null,
                  game_date: projection?.date || null,
                  projection_updated_at: projection?.updated_at || null
                };
              });

              function teamIdentity(roster) {
                if (!roster) return null;
                const owner = usersById.get(roster.owner_id) || null;
                return {
                  roster_id: roster.roster_id,
                  team_name:
                    owner?.metadata?.team_name ||
                    owner?.display_name ||
                    `Roster ${roster.roster_id}`,
                  owner_name: owner?.display_name || null,
                  avatar: owner?.metadata?.avatar || owner?.avatar || null
                };
              }

              const fantasyPositions = ["QB", "RB", "WR", "TE", "K", "DEF"];
              const available = [];

              for (const [id, p] of Object.entries(players)) {
                if (rostered.has(String(id))) continue;
                const positions = new Set(
                  [p?.position, ...(p?.fantasy_positions || [])].filter(Boolean)
                );
                if (!fantasyPositions.some(x => positions.has(x))) continue;

                const info = playerInfo(String(id), p, trendAddMap.get(String(id)) || 0);
                if (!info.team && info.trending_adds_24h === 0) continue;
                available.push(info);
              }

              available.sort((a, b) => {
                if (b.trending_adds_24h !== a.trending_adds_24h) return b.trending_adds_24h - a.trending_adds_24h;
                const at = a.team ? 1 : 0;
                const bt = b.team ? 1 : 0;
                if (bt !== at) return bt - at;
                const ad = Number(a.depth_chart_position ?? 99);
                const bd = Number(b.depth_chart_position ?? 99);
                if (ad !== bd) return ad - bd;
                return (a.name || "").localeCompare(b.name || "");
              });

              const waiverIndex = {
                updated_at: new Date().toISOString(),
                week: state.week,
                league_id: league.league_id,
                league_name: league.name,
                files: {}
              };

              for (const pos of fantasyPositions) {
                const limit = pos === "K" || pos === "DEF" ? 20 : 50;
                const list = available
                  .filter(p => p.position === pos || (p.fantasy_positions || []).includes(pos))
                  .slice(0, limit);

                const waiverPath = `data/waivers/${league.league_id}/${pos}.json`;
                writeJson(waiverPath, {
                  updated_at: new Date().toISOString(),
                  week: state.week,
                  league_id: league.league_id,
                  league_name: league.name,
                  position: pos,
                  available: list
                });
                waiverIndex.files[pos] = waiverPath;
              }

              writeJson(`data/waivers/${league.league_id}/index.json`, waiverIndex);

              // League-wide roster snapshot for trade analysis.
              const allTeams = rosters.map(r => {
                const owner = usersById.get(r.owner_id) || null;
                const teamStarters = new Set((r.starters || []).map(String));
                const teamReserve = new Set((r.reserve || []).map(String));
                const namedPlayers = (r.players || []).map(rawId => {
                  const id = String(rawId);
                  return {
                    ...playerInfo(id, players[id], trendAddMap.get(id) || 0),
                    trending_drops_24h: trendDropMap.get(id) || 0,
                    slot: teamStarters.has(id)
                      ? "STARTER"
                      : teamReserve.has(id)
                      ? "IR"
                      : "BENCH"
                  };
                });

                const counts = {};
                for (const p of namedPlayers) {
                  for (const pos of (p.fantasy_positions?.length ? p.fantasy_positions : [p.position]).filter(Boolean)) {
                    counts[pos] = (counts[pos] || 0) + 1;
                  }
                }

                return {
                  roster_id: r.roster_id,
                  owner_id: r.owner_id,
                  display_name: owner?.display_name || null,
                  team_name: owner?.metadata?.team_name || owner?.display_name || `Roster ${r.roster_id}`,
                  is_me: r.owner_id === user.user_id,
                  position_counts: counts,
                  players: namedPlayers
                };
              });

              const tradePath = `data/trades/${league.league_id}.json`;
              writeJson(tradePath, {
                updated_at: new Date().toISOString(),
                week: state.week,
                league_id: league.league_id,
                league_name: league.name,
                scoring_settings: league.scoring_settings,
                roster_positions: league.roster_positions,
                teams: allTeams
              });

              const leaguePayload = {
                updated_at: new Date().toISOString(),
                week: state.week,
                league: {
                  league_id: league.league_id,
                  name: league.name,
                  season: league.season,
                  status: league.status,
                  teams: league.total_rosters,
                  roster_positions: league.roster_positions,
                  scoring_settings: league.scoring_settings,
                  settings: league.settings
                },
                my_team_name: me?.metadata?.team_name || me?.display_name || USERNAME,
                my_team: teamIdentity(mine),
                my_roster_id: mine.roster_id,
                team: teamWithWeekData,
                matchup: myMatchup,
                opponent,
                opponent_team: teamIdentity(opponentRoster),
                waiver_index: `data/waivers/${league.league_id}/index.json`,
                trade_file: tradePath
              };

              writeJson(`data/leagues/${league.league_id}.json`, leaguePayload);

              fantasyContext.leagues.push({
                league_id: league.league_id,
                name: league.name,
                teams: league.total_rosters,
                my_roster_id: mine.roster_id,
                my_team_name: me?.metadata?.team_name || me?.display_name || USERNAME,
                league_file: `data/leagues/${league.league_id}.json`,
                waiver_index: `data/waivers/${league.league_id}/index.json`,
                trade_file: tradePath
              });
            }

            writeJson("data/context.json", fantasyContext);

      - name: Commit updated data
        run: |
          git config user.name "ViennaSteel Fantasy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Sleeper data"
            git pull --rebase origin main
            git push
          fi
